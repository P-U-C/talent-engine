name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The scoring core is standard library only and the suite makes no
      # network calls -- but the runner still needs pytest itself.
      - name: Install test runner
        run: python3 -m pip install --disable-pip-version-check --quiet pytest

      - name: Tests
        run: python3 -m pytest -q

      # The product claim is that the engine has no runtime dependencies. Assert
      # it rather than trusting the comment above: import the scoring path in a
      # fresh interpreter with only the standard library and pytest present.
      - name: Scoring core imports with no third-party dependencies
        run: |
          python3 - <<'PY'
          import sys
          before = set(sys.modules)
          from talent_engine.scoring.engine import score_snapshot  # noqa: F401
          from talent_engine.config import load_program            # noqa: F401
          import pathlib, sysconfig
          stdlib = pathlib.Path(sysconfig.get_paths()["stdlib"]).resolve()
          here = pathlib.Path.cwd().resolve()
          leaked = []
          for name in set(sys.modules) - before:
              mod = sys.modules[name]
              path = getattr(mod, "__file__", None)
              if not path:
                  continue
              p = pathlib.Path(path).resolve()
              if stdlib in p.parents or here in p.parents:
                  continue
              leaked.append(f"{name} -> {p}")
          if leaked:
              print("third-party imports in the scoring path:")
              print("\n".join(sorted(leaked)))
              raise SystemExit(1)
          print("ok: scoring core is standard library only")
          PY

      # RUBRIC.md is the promise that a candidate can reproduce their own
      # score. It silently documented one programme's weights while a
      # different programme did the scoring, so the table is generated and
      # this fails the build when the two disagree.
      - name: Published rubric matches the configs
        run: python3 tools/render_rubric_weights.py --check

      # Only meaningful in a deployment fork, where README.md and
      # docs/ENGINE.md belong to the deployment and an upstream merge will
      # quietly take them. Skipped upstream, where the script does not exist.
      - name: Deployment-owned files survived
        run: |
          if [ -x tools/sync-from-upstream.sh ]; then
            tools/sync-from-upstream.sh --check
          else
            echo "not a deployment fork; nothing to check"
          fi

      - name: No cache or database committed
        run: |
          if git ls-files | grep -Ei '\.sqlite3?$|^\.cache/'; then
            echo "A cache or database file is tracked. These hold raw API"
            echo "responses about real people and this repository is public."
            exit 1
          fi
          echo "ok: no cache or database tracked"
